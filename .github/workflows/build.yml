name: 'Build OpenWrt WPX8324 Minimal'

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Pilih Versi/Branch OpenWrt'
        required: true
        type: choice
        default: 'v25.12.5'
        options:
          - 'snapshot'
          - 'v25.12.5'
          - 'v25.12.4'
      custom_packages:
        description: 'Daftar Paket Tambahan Minimal'
        required: false
        type: string
        default: 'luci luci-ssl block-mount usbutils nano htop curl'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Repositori Utama
        uses: actions/checkout@v4

      - name: 2. Bersihkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: 3. Instal Dependensi Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget ccache curl

      - name: 4. Clone Source OpenWrt
        run: git clone https://github.com/openwrt/openwrt.git ./openwrt

      - name: 5. Atur Cache Build
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ${{ runner.os }}-openwrt-qualcommax-${{ github.event.inputs.openwrt_version }}-v1
          restore-keys: |
            ${{ runner.os }}-openwrt-qualcommax-${{ github.event.inputs.openwrt_version }}-v1-

      - name: 6. Terapkan Patch WPX8324 & Update Feeds
        working-directory: ./openwrt
        run: |
          echo "BUILD_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          git checkout ${{ github.event.inputs.openwrt_version }}

          # Terapkan patch lengkap (DTS, Makefile, board binary data, & scripts)
          git apply $GITHUB_WORKSPACE/patches/wpx.patch

          # 2. Buat direktori tujuan untuk file kustom
          mkdir -p files/etc/uci-defaults/
          mkdir -p files/etc/profile.d/

          # 3. Salin skrip kustomisasi
          cp $GITHUB_WORKSPACE/custom-files/etc/uci-defaults/99-custom-settings files/etc/uci-defaults/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/custom-files/etc/profile.d/30-userinfo.sh files/etc/profile.d/ 2>/dev/null || true
          chmod +x files/etc/uci-defaults/* files/etc/profile.d/* 2>/dev/null || true

          # Update & install feeds bawaan OpenWrt saja
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 7. Konfigurasi Target Build (.config)
        working-directory: ./openwrt
        run: |
          echo 'CONFIG_CCACHE=y' > .config
          echo 'CONFIG_TARGET_qualcommax=y' >> .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx=y' >> .config
          echo '# CONFIG_TARGET_qualcommax_ipq807x is not set' >> .config
          echo 'CONFIG_TARGET_MULTI_PROFILE=y' >> .config
          echo 'CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_liteon_wpx8324=y' >> .config

          CUSTOM_PKGS="${{ github.event.inputs.custom_packages }}"
          if [ -n "$CUSTOM_PKGS" ]; then
            for pkg in $CUSTOM_PKGS; do
              if [[ $pkg == -* ]]; then
                clean_pkg="${pkg#-}"
                echo "# CONFIG_PACKAGE_$clean_pkg is not set" >> .config
              else
                echo "CONFIG_PACKAGE_$pkg=y" >> .config
              fi
            done
          fi
          make defconfig

      - name: 8. Proses Compile Firmware
        working-directory: ./
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
          USE_CCACHE: 1
        run: |
          make -j$(nproc) -C openwrt download
          make -j$(nproc) -C openwrt world || make -j1 V=s -C openwrt world

      - name: 9. Unggah Artefak Firmware
        uses: actions/upload-artifact@v4
        with:
          name: WPX8324-Minimal-${{ github.event.inputs.openwrt_version }}-${{ env.BUILD_DATE }}
          path: ./openwrt/bin/targets/qualcommax/ipq50xx/*wpx8324*

